name: Merge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-experience-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-pull-request.yml@main
    secrets: inherit
    with:
      solution: Novolis.MobileExperience.slnx
      run_tests: true
      test_projects: tests/Novolis.MobileExperience.Unit/Novolis.MobileExperience.Unit.csproj
    permissions:
      contents: read
      packages: read
